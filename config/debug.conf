# Debug build for the Glove80 left half. Used together with the zmk-usb-logging
# snippet, which adds the USB serial port the log goes to.

# Warnings and errors only. Every debug line is a warning, and ZMK's own debug
# messages stay off.
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192

# ZMK turns the USB driver's log off when logging over USB. The wait meter lives in
# the USB driver, so its warnings are switched back on.
CONFIG_USB_DRIVER_LOG_LEVEL_WRN=y

# Thread names in the timing lines.
CONFIG_THREAD_NAME=y

# Save settings 1 s after a change instead of 60 s, so a measurement needs no wait.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000
